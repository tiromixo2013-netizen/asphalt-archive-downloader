name: Fetch Asphalt 53.5.3a archive

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "Temporary direct download URL for the full Asphalt.zip archive"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install downloader and ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 unzip
      - name: Download full archive
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$DOWNLOAD_URL"
          aria2c --continue=true --max-tries=12 --retry-wait=15 --connect-timeout=30 \
            --timeout=120 --file-allocation=none --summary-interval=30 \
            --out=Asphalt.zip "$DOWNLOAD_URL"
          test -s Asphalt.zip
          ls -lh Asphalt.zip
          unzip -tq Asphalt.zip
      - name: Create checksums and split for GitHub release limits
        run: |
          set -euo pipefail
          sha256sum Asphalt.zip > Asphalt.zip.sha256
          sha1sum Asphalt.zip > Asphalt.zip.sha1
          split -b 1800M -d -a 2 Asphalt.zip Asphalt.zip.part
          ls -lh Asphalt.zip.part*
      - name: Publish archive parts as release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create asphalt-53.5.3a --title "Asphalt 53.5.3a full archive" \
            --notes "Original archive downloaded from the user-provided source. Join the numbered parts in order to reconstruct Asphalt.zip, then verify using Asphalt.zip.sha256."
          gh release upload asphalt-53.5.3a Asphalt.zip.part* Asphalt.zip.sha256 Asphalt.zip.sha1
