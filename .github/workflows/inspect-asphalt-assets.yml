name: Inspect Asphalt game data assets
on:
  push:
    paths:
      - ".github/workflows/inspect-asphalt-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download and verify original archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download asphalt-53.5.3a --repo "$GH_REPO" --pattern 'Asphalt.zip.part*' --dir .
          cat Asphalt.zip.part00 Asphalt.zip.part01 Asphalt.zip.part02 > Asphalt.zip
          gh release download asphalt-53.5.3a --repo "$GH_REPO" --pattern 'Asphalt.zip.sha256' --dir .
          sha256sum -c Asphalt.zip.sha256
      - name: Inventory game-data split APK contents
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import zipfile, io, collections, pathlib, re
          outer=zipfile.ZipFile("Asphalt.zip")
          targets=[n for n in outer.namelist() if n.lower().endswith(".apk") and not n.lower().endswith(("asphalt-53.5.3a.apk","config.arm64_v8a.apk","config.xxhdpi.apk"))]
          rows=[]
          extcounts=collections.Counter()
          candidates=[]
          keywords=re.compile(rb'graphics|quality|resolution|frame.?rate|fps|render|texture|shader|settings|anti.?alias|shadow|upscal|vsync|refresh.?rate',re.I)
          for name in sorted(targets):
              data=outer.read(name)
              try: z=zipfile.ZipFile(io.BytesIO(data))
              except Exception as e:
                  rows.append(f"## {name} INVALID_ZIP {e}")
                  continue
              infos=z.infolist()
              rows.append(f"## {name} bytes={len(data)} entries={len(infos)}")
              for i in infos:
                  if i.is_dir(): continue
                  p=i.filename
                  ext=pathlib.PurePosixPath(p).suffix.lower() or "[no-ext]"
                  extcounts[(name,ext)]+=1
                  rows.append(f"{i.file_size}\t{i.compress_size}\t{p}")
                  low=p.lower()
                  if (ext in {".json",".xml",".ini",".cfg",".conf",".txt",".csv",".lua",".js",".yaml",".yml",".properties",".strings",".plist",".dat"} or any(k in low for k in ("setting","config","graphic","render","quality","localiz","string"))):
                      if i.file_size <= 8*1024*1024:
                          try:
                              b=z.read(p)
                              if keywords.search(b):
                                  hits=list(re.finditer(keywords,b))
                                  sample=[]
                                  for m in hits[:30]:
                                      s=max(0,m.start()-100); e=min(len(b),m.end()+180)
                                      sample.append(b[s:e].decode("utf-8","replace").replace("\\x00"," ")[:350])
                                  candidates.append(f"\n### {name} :: {p} size={i.file_size}\n"+"\n---\n".join(sample))
                          except Exception: pass
          pathlib.Path("reports/split-file-inventory.txt").write_text("\n".join(rows),encoding="utf-8")
          pathlib.Path("reports/split-extension-counts.txt").write_text("\n".join(f"{n}\t{e}\t{c}" for (n,e),c in sorted(extcounts.items())),encoding="utf-8")
          pathlib.Path("reports/config-string-hits.txt").write_text("\n".join(candidates[:1500]),encoding="utf-8")
          print("splits",len(targets),"entries",sum(extcounts.values()),"candidate files",len(candidates))
          PY
      - name: Detect asset formats and embedded strings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,io,collections,pathlib,re,struct,json
          outer=zipfile.ZipFile("Asphalt.zip")
          out=[]
          magic=collections.Counter()
          text_hits=[]
          json_files=[]
          keywords=re.compile(rb'graphics|quality|resolution|frame.?rate|fps|render|texture|shader|settings|anti.?alias|shadow|upscal|vsync|refresh.?rate|menu|option',re.I)
          for apk in sorted(n for n in outer.namelist() if n.lower().endswith(".apk") and n.lower().endswith(("gin.apk","lm.apk","main.apk","mdc.apk","mde.apk","prb.apk","sk.apk","so.apk","tex.apk","tex_lowres.apk"))):
              z=zipfile.ZipFile(io.BytesIO(outer.read(apk)))
              for info in z.infolist():
                  if info.is_dir() or info.filename=="AndroidManifest.xml": continue
                  try: b=z.read(info.filename)
                  except: continue
                  if len(b)<4: continue
                  magic[(apk,b[:8].hex())]+=1
                  if apk=="main.apk" and info.filename.lower().endswith(".json"):
                      json_files.append((info.filename,b[:200000].decode("utf-8","replace")))
                  # Scan all payloads, not only files with familiar extensions.
                  if len(b)<=4*1024*1024:
                      for enc,raw in (("ascii",b),("utf16le",b[::1])):
                          m=keywords.search(raw)
                          if m:
                              s=max(0,m.start()-100); e=min(len(raw),m.end()+180)
                              text_hits.append(f"## {apk} {info.filename} size={len(b)} encoding={enc}\n{raw[s:e].decode("utf-8","replace")[:400]}")
                              break
          pathlib.Path("reports/asset-magic-signatures.txt").write_text("\n".join(f"{a}\t{m}\t{c}" for (a,m),c in magic.most_common(300)),encoding="utf-8")
          pathlib.Path("reports/all-payload-string-hits.txt").write_text("\n---\n".join(text_hits[:2500]),encoding="utf-8")
          pathlib.Path("reports/main-json-files.txt").write_text("\n".join(f"## {p}\n{s}" for p,s in json_files),encoding="utf-8")
          print("magic groups",len(magic),"string hits",len(text_hits),"json",len(json_files))
          PY
      - name: Upload asset research reports
        uses: actions/upload-artifact@v4
        with:
          name: asphalt-53.5.3a-game-data-assets
          path: reports/
          if-no-files-found: error
          retention-days: 7
